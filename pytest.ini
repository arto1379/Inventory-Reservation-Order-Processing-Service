[pytest]
; Tests import the app as `src.xxx`, so the repo root must be on sys.path.
; Running `pytest` from the repo root already satisfies this via rootdir
; insertion, this just makes it explicit for other tools/IDEs.
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    concurrency: marks slow tests that exercise real concurrent DB access
