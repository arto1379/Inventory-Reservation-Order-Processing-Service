version: "3.9"

# -----------------------------------------------------------------------------
# Local development / evaluation stack.
#
#   docker compose up --build
#
# Brings up: PostgreSQL, Redis, the REST API, the Celery worker (order
# processing), Celery Beat (reservation expiration scheduler), and the
# outbox relay process (publishes committed outbox events onto the queue).
# -----------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-creates the separate test database used by the test suite.
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Run migrations before starting the server so `docker compose up` alone
    # is enough to get a fully-migrated, runnable API (see README "How to run").
    command: >
      sh -c "alembic upgrade head &&
             python -m src.bootstrap &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app

  worker:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - .:/app

  beat:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A src.workers.celery_app beat --loglevel=info
    volumes:
      - .:/app

  outbox-relay:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m src.workers.outbox_relay
    volumes:
      - .:/app

volumes:
  postgres_data:
