[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# The actual URL is injected at runtime in migrations/env.py from
# src.config.settings (which reads DATABASE_URL from the environment / .env),
# so this stays a harmless placeholder if alembic.ini is ever read directly.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
